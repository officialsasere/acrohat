name: Release
# Builds installers for every platform and publishes them as a GitHub release, under FIXED file names so the
# website can link straight to them (…/releases/latest/download/Acrohat-Windows-Setup.exe).
#
# Run it from the Actions tab ("Release" → "Run workflow"), or push a tag such as v0.1.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: '--target aarch64-apple-darwin' }
          - { os: macos-latest, args: '--target x86_64-apple-darwin' }
          - { os: ubuntu-22.04, args: '' }
          - { os: windows-latest, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: Acrohat ${{ steps.tag.outputs.tag }}
          releaseBody: |
            Download the installer for your system. The installers are not code-signed yet, so macOS and Windows will warn the first time; see the website for the two-click workaround.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Publish fixed download names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          echo "$PATHS" | jq -r '.[]' | sed 's#\\#/#g' | while read -r f; do
            case "$f" in
              *aarch64*.dmg)             name=Acrohat-macOS-AppleSilicon.dmg ;;
              *x64*.dmg|*x86_64*.dmg)    name=Acrohat-macOS-Intel.dmg ;;
              *.msi)                     name=Acrohat-Windows.msi ;;
              *-setup.exe)               name=Acrohat-Windows-Setup.exe ;;
              *.AppImage)                name=Acrohat-Linux.AppImage ;;
              *.deb)                     name=Acrohat-Linux.deb ;;
              *) continue ;;
            esac
            cp "$f" "$RUNNER_TEMP/$name"
            gh release upload "$TAG" "$RUNNER_TEMP/$name" --clobber
            echo "uploaded $name"
          done
