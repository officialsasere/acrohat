# Netlify hosts the Kwiiva website (/), each app's page (/paper/, /write/, /grid/) and its web app (/paper/app/, /write/app/, /grid/app/).
# Installers are served by GitHub Releases. The small function in netlify/functions counts downloads and launches.
[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/write/app"
  to = "/write/app/"
  status = 301
[[redirects]]
  from = "/grid/app"
  to = "/grid/app/"
  status = 301

# Short links: `/paper/app` opens the editor; the old `/app/` address (before the rename) goes there too.
[[redirects]]
  from = "/paper/app"
  to = "/paper/app/"
  status = 301
[[redirects]]
  from = "/app"
  to = "/paper/app/"
  status = 301
[[redirects]]
  from = "/app/"
  to = "/paper/app/"
  status = 301

# Files whose names contain a content hash never change, so browsers may keep them forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Bundled fonts, OCR engine and language data: large, rarely change.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/ocr/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
