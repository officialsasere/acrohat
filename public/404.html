<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found – Acrohat</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light dark; --bg:#fff; --text:#1c1f26; --muted:#5b6577; --accent:#d6342a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171b; --text:#e8eaee; --muted:#a3acba; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:17px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; text-align:center; padding:24px; }
    img { width:72px; height:72px; } h1 { margin:12px 0 4px; } p { color:var(--muted); margin:0 0 20px; }
    a { display:inline-block; margin:4px; padding:11px 22px; border-radius:10px; text-decoration:none; font-weight:600; border:1px solid #dfe3ea; color:inherit; }
    a.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="" />
    <h1>That page doesn't exist</h1>
    <p>The link may be old or mistyped.</p>
    <a class="primary" href="/">Go to Acrohat</a><a href="/app/">Open the editor</a>
  </main>
</body>
</html>
