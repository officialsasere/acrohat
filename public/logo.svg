<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="0.55" stop-color="#e5293b"/>
      <stop offset="1" stop-color="#8f1470"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3e6"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="300" y1="330" x2="680" y2="830">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#b3157a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#4a0420" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- soft highlight -->
  <path d="M0 232C0 104 104 0 232 0h560c-210 40-470 150-792 420z" fill="#fff" opacity="0.10"/>
  <!-- page with folded corner -->
  <g filter="url(#sh)">
    <path d="M262 150h330l190 190v518c0 32-26 58-58 58H262c-32 0-58-26-58-58V208c0-32 26-58 58-58z" fill="url(#page)"/>
  </g>
  <path d="M592 150v152c0 20 18 38 38 38h152z" fill="#f4a9b3"/>
  <!-- the A -->
  <path d="M342 790 452 392c9-26 45-26 54 0L616 790" fill="none" stroke="url(#mark)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- text-cursor crossbar: the "edit" idea -->
  <path d="M392 690h174" stroke="url(#mark)" stroke-width="64" stroke-linecap="round"/>
  <!-- text caret inside the A: this is an editor -->
  <g stroke="#2a1a3a" stroke-width="15" stroke-linecap="round">
    <path d="M479 478v112"/>
    <path d="M461 478h36M461 590h36"/>
  </g>
</svg>
