[package]
name = "acrohat"
version = "0.1.0"
description = "Edit, convert and sign PDFs. Free and open source."
authors = ["Acrohat contributors"]
license = "MIT"
repository = "https://github.com/officialsasere/acrohat"
edition = "2021"
rust-version = "1.77"

[lib]
name = "acrohat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
